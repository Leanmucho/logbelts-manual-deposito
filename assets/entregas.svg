<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="t d">
<title id="t">Entregas entre puestos</title><desc id="d">Encargada entrega pedido y hoja a Picking; Picking entrega la mercadería preparada a Control; Control devuelve estado y diferencias y recibe documentos de salida.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#006b65"/></marker><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#55758c"/></marker></defs><rect width="760" height="270" rx="18" fill="#f8fbfa"/>
<g font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">
<rect x="35" y="82" width="176" height="105" rx="15" fill="#e5f1ed" stroke="#b6d4cb"/><text x="123" y="121" fill="#006b65" font-size="12" font-weight="800" letter-spacing="1">PUESTO 01</text><text x="123" y="151" fill="#18313d" font-size="18" font-weight="750">Encargada</text>
<rect x="292" y="82" width="176" height="105" rx="15" fill="#fff" stroke="#d7e2e1"/><text x="380" y="121" fill="#006b65" font-size="12" font-weight="800" letter-spacing="1">PUESTO 02</text><text x="380" y="151" fill="#18313d" font-size="18" font-weight="750">Picking</text>
<rect x="549" y="82" width="176" height="105" rx="15" fill="#eef2f5" stroke="#ced9df"/><text x="637" y="121" fill="#55758c" font-size="12" font-weight="800" letter-spacing="1">PUESTO 03</text><text x="637" y="151" fill="#18313d" font-size="18" font-weight="750">Control</text>
<path d="M212 111h76" stroke="#006b65" stroke-width="3" marker-end="url(#a)"/><text x="250" y="99" fill="#536774" font-size="10">pedido + hoja</text><path d="M212 160h76" stroke="#55758c" stroke-width="3" marker-end="url(#b)"/><text x="250" y="180" fill="#536774" font-size="10">prioridad + envío</text>
<path d="M469 112h76" stroke="#006b65" stroke-width="3" marker-end="url(#a)"/><text x="507" y="99" fill="#536774" font-size="10">mercadería + hoja</text><path d="M546 160h-76" stroke="#55758c" stroke-width="3" marker-end="url(#b)"/><text x="508" y="180" fill="#536774" font-size="10">diferencia / control</text><text x="380" y="232" fill="#536774" font-size="13">La salida se controla de nuevo: remito, cliente y total de bultos.</text></g></svg>
