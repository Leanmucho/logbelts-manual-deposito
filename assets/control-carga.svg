<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t d">
<title id="t">Comprobación de bultos</title><desc id="d">El Controlador compara la línea de control, el cliente, el remito y el total de bultos antes de marcar la carga como completa.</desc><rect width="760" height="330" rx="18" fill="#f4f6f9"/>
<g font-family="system-ui,Segoe UI,sans-serif"><text x="40" y="47" fill="#0f2f63" font-size="17" font-weight="750">Una línea de control = un pedido completo</text><rect x="36" y="72" width="688" height="78" rx="10" fill="#fff" stroke="#c9daf3"/><path d="M36 110h688M158 72v78M282 72v78M444 72v78M560 72v78" stroke="#dbe1ea"/>
<g fill="#566175" font-size="11" font-weight="700"><text x="51" y="97">PAQUETES</text><text x="174" y="97">CLIENTE</text><text x="298" y="97">N.º REMITO</text><text x="460" y="97">BULTOS</text><text x="576" y="97">CONTROL</text></g><g fill="#16243b" font-size="14" font-weight="650"><text x="51" y="132">1 pedido</text><text x="174" y="132">Mismo cliente</text><text x="298" y="132">Mismo número</text><text x="460" y="132">Mismo total</text><text x="576" y="132">Tachar al cerrar</text></g>
<g transform="translate(59 182)"><rect width="124" height="71" rx="9" fill="#e8f0fb" stroke="#c9daf3"/><path d="M21 20h35m-35 12h54m-54 12h46" stroke="#19458c" stroke-width="4" stroke-linecap="round"/><text x="75" y="62" text-anchor="middle" fill="#16243b" font-size="12" font-weight="700">Hoja</text></g>
<g transform="translate(318 182)"><rect width="124" height="71" rx="9" fill="#eef2f5" stroke="#dbe1ea"/><path d="M42 14h42v43H42zM50 25h26m-26 9h26m-26 9h20" fill="none" stroke="#2271d6" stroke-width="3"/><text x="62" y="68" text-anchor="middle" fill="#16243b" font-size="12" font-weight="700">Remito</text></g>
<g transform="translate(578 178)"><path d="M4 28 40 7l37 21v42H4z" fill="#fff4df" stroke="#bf8b3f" stroke-width="2"/><path d="m4 28 36 21 37-21M40 49v21" fill="none" stroke="#bf8b3f" stroke-width="2"/><text x="41" y="92" text-anchor="middle" fill="#16243b" font-size="12" font-weight="700">Bultos juntos</text></g>
