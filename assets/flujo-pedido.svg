<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" role="img" aria-labelledby="t d">
<title id="t">Recorrido del pedido</title><desc id="d">Cinco etapas conectadas: aprobación y hoja, picking y armado, control, remito y carga, salida.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#a3a9b5"/></marker></defs><rect width="880" height="280" rx="18" fill="#f4f6f9"/>
<g font-family="system-ui,Segoe UI,sans-serif" text-anchor="middle">
<g><rect x="20" y="65" width="148" height="142" rx="16" fill="#e8f0fb" stroke="#c9daf3"/><circle cx="94" cy="101" r="19" fill="#19458c"/><text x="94" y="107" fill="white" font-size="16" font-weight="800">01</text><text x="94" y="148" fill="#16243b" font-size="15" font-weight="750">Autorización</text><text x="94" y="169" fill="#566175" font-size="13">+ hoja</text></g>
<g><rect x="192" y="65" width="148" height="142" rx="16" fill="#fff" stroke="#dbe1ea"/><circle cx="266" cy="101" r="19" fill="#19458c"/><text x="266" y="107" fill="white" font-size="16" font-weight="800">02</text><text x="266" y="148" fill="#16243b" font-size="15" font-weight="750">Picking</text><text x="266" y="169" fill="#566175" font-size="13">+ armado</text></g>
<g><rect x="364" y="65" width="148" height="142" rx="16" fill="#fff" stroke="#dbe1ea"/><circle cx="438" cy="101" r="19" fill="#2271d6"/><text x="438" y="107" fill="white" font-size="16" font-weight="800">03</text><text x="438" y="148" fill="#16243b" font-size="15" font-weight="750">Control</text><text x="438" y="169" fill="#566175" font-size="13">código + cantidad</text></g>
<g><rect x="536" y="65" width="148" height="142" rx="16" fill="#fff" stroke="#dbe1ea"/><circle cx="610" cy="101" r="19" fill="#2271d6"/><text x="610" y="107" fill="white" font-size="16" font-weight="800">04</text><text x="610" y="148" fill="#16243b" font-size="15" font-weight="750">Remito</text><text x="610" y="169" fill="#566175" font-size="13">+ carga verificada</text></g>
<g><rect x="708" y="65" width="148" height="142" rx="16" fill="#0f2f63"/><circle cx="782" cy="101" r="19" fill="#d69b44"/><text x="782" y="107" fill="#0f2f63" font-size="16" font-weight="800">05</text><text x="782" y="148" fill="white" font-size="15" font-weight="750">Salida</text><text x="782" y="169" fill="#c9daf3" font-size="13">pedido completo</text></g>
<path d="M169 136h19m153 0h19m153 0h19m153 0h19" stroke="#a3a9b5" stroke-width="3" marker-end="url(#a)"/><text x="440" y="244" fill="#566175" font-size="13">La hoja acompaña a los artículos hasta el control final.</text></g></svg>
